<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <!-- ADC badge mark — 120×120 squircle (references badge generated by Task #2) -->
  <image href="./logo-badge.svg" x="0" y="0" width="120" height="120"/>

  <!-- Wordmark group — 16px gap from badge right edge -->
  <g transform="translate(144, 0)">
    <!-- "ADC" — Geist 600, 64px, Snow #F0F0F5, tight letter-spacing -->
    <text
      x="0"
      y="74"
      font-family="'Geist Variable', 'Geist', 'Inter', -apple-system, sans-serif"
      font-size="64"
      font-weight="600"
      letter-spacing="-1"
      fill="#F0F0F5"
    >ADC</text>

    <!-- "AGENTIC DESKTOP COMMAND" — Geist 400, 12px, Ash #6B6B72, wide tracking -->
    <text
      x="2"
      y="100"
      font-family="'Geist Variable', 'Geist', 'Inter', -apple-system, sans-serif"
      font-size="12"
      font-weight="400"
      letter-spacing="4"
      fill="#6B6B72"
    >AGENTIC DESKTOP COMMAND</text>
  </g>
</svg>
