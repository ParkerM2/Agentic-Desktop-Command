<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ADC Hub Admin</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-2: #181c25;
    --border: #252a35;
    --fg: #e6e8ee;
    --fg-dim: #9aa3b2;
    --accent: #6aa9ff;
    --danger: #ef6464;
    --ok: #5bd39b;
    --warn: #e0b452;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
  header .env { color: var(--fg-dim); font-size: 12px; }
  nav.tabs {
    display: flex;
    gap: 4px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  nav.tabs button {
    background: transparent;
    color: var(--fg-dim);
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  nav.tabs button.active {
    color: var(--fg);
    border-bottom-color: var(--accent);
  }
  main { padding: 20px; max-width: 1200px; }
  section { display: none; }
  section.active { display: block; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.8px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  th {
    background: var(--panel-2);
    color: var(--fg-dim);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--panel-2); }
  button, input, select {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 500; }
  button.primary:hover { opacity: 0.9; }
  input, select { min-width: 120px; }
  .form-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .form-row label { color: var(--fg-dim); font-size: 12px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .dim { color: var(--fg-dim); }
  .status-ok { color: var(--ok); }
  .status-bad { color: var(--danger); }
  .status-warn { color: var(--warn); }
  .actions button { margin-right: 4px; padding: 4px 8px; font-size: 12px; }
  .truncate { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
  .pagination { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  .field {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .field label { display: block; color: var(--fg-dim); font-size: 12px; margin-bottom: 4px; }
  .field .value { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    min-width: 360px;
    max-width: 480px;
  }
  .modal h3 { margin: 0 0 10px; font-size: 15px; }
  .modal p { margin: 0 0 12px; color: var(--fg-dim); }
  .modal .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .toast {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 13px;
    z-index: 200;
    display: none;
  }
  .toast.error { border-left-color: var(--danger); }
  .empty { padding: 24px; text-align: center; color: var(--fg-dim); }
</style>
</head>
<body>
<header>
  <h1>ADC Hub Admin</h1>
  <div class="env"><span id="hubIdLabel" class="mono"></span></div>
</header>
<nav class="tabs">
  <button data-tab="clients" class="active">Clients</button>
  <button data-tab="audit">Audit</button>
  <button data-tab="settings">Settings</button>
</nav>
<main>
  <section id="tab-clients" class="active">
    <h2>Paired Clients</h2>
    <div class="form-row">
      <button id="refreshClients">Refresh</button>
    </div>
    <table id="clientsTable">
      <thead>
        <tr>
          <th>Display Name</th>
          <th>Client ID</th>
          <th>Paired At</th>
          <th>Last Seen</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-audit">
    <h2>Audit Log</h2>
    <div class="form-row">
      <label>Event
        <select id="auditEventType">
          <option value="">all</option>
          <option value="pair.init">pair.init</option>
          <option value="pair.confirm">pair.confirm</option>
          <option value="pair.reject">pair.reject</option>
          <option value="key.revoke">key.revoke</option>
          <option value="key.use">key.use</option>
        </select>
      </label>
      <label>Client ID <input id="auditClientId" type="text" placeholder="optional" /></label>
      <label>From <input id="auditFrom" type="datetime-local" /></label>
      <label>To <input id="auditTo" type="datetime-local" /></label>
      <button id="auditSearch">Search</button>
      <button id="auditReset">Reset</button>
    </div>
    <table id="auditTable">
      <thead>
        <tr>
          <th>Time</th>
          <th>Event</th>
          <th>Client</th>
          <th>Outcome</th>
          <th>Source IP</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="pagination">
      <button id="auditPrev">Prev</button>
      <span class="dim" id="auditPageInfo">page 1</span>
      <button id="auditNext">Next</button>
    </div>
  </section>

  <section id="tab-settings">
    <h2>Hub Settings</h2>
    <div class="field">
      <label>Hub Display Name</label>
      <div class="value" id="hubDisplayName">—</div>
    </div>
    <div class="field">
      <label>TLS Fingerprint (SHA-256)</label>
      <div class="value"><span id="tlsFingerprint">unknown</span>
        <button id="copyFp" style="margin-left:10px;">Copy</button>
      </div>
    </div>
    <div class="field">
      <label>Admin Key</label>
      <div class="value dim">Rotating will immediately invalidate this session. You will be prompted for the new key on the next request.</div>
      <div style="margin-top:10px;"><button id="rotateKey" class="danger">Rotate Admin Key…</button></div>
    </div>
  </section>
</main>

<div id="modal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <h3 id="modalTitle">Confirm</h3>
    <p id="modalBody"></p>
    <div id="modalInputWrap" style="display:none;">
      <input id="modalInput" type="text" style="width:100%;" />
    </div>
    <div class="row">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk" class="primary">Confirm</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  // ----------- admin key handling -----------
  var ADMIN_KEY_SS = 'adc-hub-admin-key';

  function getAdminKey() {
    var k = sessionStorage.getItem(ADMIN_KEY_SS);
    if (!k) {
      k = window.prompt('Enter X-Admin-Key for this hub:');
      if (k && k.length > 0) {
        sessionStorage.setItem(ADMIN_KEY_SS, k);
      }
    }
    return k;
  }

  function clearAdminKey() {
    sessionStorage.removeItem(ADMIN_KEY_SS);
  }

  // ----------- fetch wrapper -----------
  function api(path, opts) {
    opts = opts || {};
    var key = getAdminKey();
    if (!key) return Promise.reject(new Error('admin key required'));
    var headers = Object.assign({}, opts.headers || {});
    headers['X-Admin-Key'] = key;
    if (opts.body !== undefined && opts.body !== null && typeof opts.body !== 'string') {
      headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(path, Object.assign({}, opts, { headers: headers })).then(function (res) {
      if (res.status === 401) {
        // admin key wrong — clear and re-prompt
        clearAdminKey();
        toast('Admin key rejected — please re-enter.', true);
        setTimeout(function () { location.reload(); }, 1200);
        throw new Error('401 unauthorized');
      }
      if (!res.ok) {
        return res.text().then(function (t) { throw new Error(res.status + ' ' + t); });
      }
      var ct = res.headers.get('content-type') || '';
      if (ct.indexOf('application/json') >= 0) return res.json();
      return res.text();
    });
  }

  // ----------- toast -----------
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.className = 'toast' + (isError ? ' error' : '');
    toastEl.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 3000);
  }

  // ----------- modal -----------
  var modal = document.getElementById('modal');
  var modalTitle = document.getElementById('modalTitle');
  var modalBody = document.getElementById('modalBody');
  var modalInputWrap = document.getElementById('modalInputWrap');
  var modalInput = document.getElementById('modalInput');
  var modalOk = document.getElementById('modalOk');
  var modalCancel = document.getElementById('modalCancel');

  function confirmModal(opts) {
    return new Promise(function (resolve) {
      modalTitle.textContent = opts.title || 'Confirm';
      modalBody.textContent = opts.body || '';
      if (opts.input) {
        modalInputWrap.style.display = 'block';
        modalInput.value = opts.inputDefault || '';
        modalInput.placeholder = opts.inputPlaceholder || '';
      } else {
        modalInputWrap.style.display = 'none';
      }
      modalOk.textContent = opts.okLabel || 'Confirm';
      modalOk.className = opts.danger ? 'danger' : 'primary';
      modal.classList.add('open');

      function done(val) {
        modal.classList.remove('open');
        modalOk.onclick = null;
        modalCancel.onclick = null;
        resolve(val);
      }
      modalOk.onclick = function () { done(opts.input ? modalInput.value : true); };
      modalCancel.onclick = function () { done(null); };
    });
  }

  // ----------- tabs -----------
  var tabButtons = document.querySelectorAll('nav.tabs button');
  var sections = document.querySelectorAll('main section');
  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var tab = btn.getAttribute('data-tab');
      tabButtons.forEach(function (b) { b.classList.toggle('active', b === btn); });
      sections.forEach(function (s) { s.classList.toggle('active', s.id === 'tab-' + tab); });
      if (tab === 'clients') loadClients();
      if (tab === 'audit') loadAudit();
      if (tab === 'settings') loadSettings();
    });
  });

  // ----------- clients tab -----------
  var clientsBody = document.querySelector('#clientsTable tbody');

  function fmtDate(v) {
    if (v === null || v === undefined || v === '') return '—';
    var n = typeof v === 'number' ? v : Date.parse(v);
    if (isNaN(n)) return String(v);
    return new Date(n).toISOString().replace('T', ' ').slice(0, 19) + 'Z';
  }

  function loadClients() {
    clientsBody.innerHTML = '<tr><td colspan="6" class="empty">Loading…</td></tr>';
    api('/api/admin/clients').then(function (rows) {
      if (!rows || rows.length === 0) {
        clientsBody.innerHTML = '<tr><td colspan="6" class="empty">No paired clients.</td></tr>';
        return;
      }
      clientsBody.innerHTML = '';
      rows.forEach(function (c) {
        var tr = document.createElement('tr');
        var statusHtml = c.revokedAt
          ? '<span class="status-bad">Revoked</span>' + (c.revokedReason ? ' <span class="dim">(' + escapeHtml(c.revokedReason) + ')</span>' : '')
          : '<span class="status-ok">Active</span>';
        tr.innerHTML =
          '<td>' + escapeHtml(c.displayName || '—') + '</td>' +
          '<td class="mono truncate" title="' + escapeHtml(c.clientId) + '">' + escapeHtml(c.clientId.slice(0, 8)) + '…</td>' +
          '<td class="mono">' + fmtDate(c.pairedAt) + '</td>' +
          '<td class="mono">' + fmtDate(c.lastSeenAt) + '</td>' +
          '<td>' + statusHtml + '</td>' +
          '<td class="actions"></td>';
        var actions = tr.querySelector('.actions');
        var renameBtn = document.createElement('button');
        renameBtn.textContent = 'Rename';
        renameBtn.onclick = function () { onRename(c); };
        var revokeBtn = document.createElement('button');
        revokeBtn.textContent = 'Revoke';
        revokeBtn.className = 'danger';
        revokeBtn.disabled = !!c.revokedAt;
        revokeBtn.onclick = function () { onRevoke(c); };
        var resetBtn = document.createElement('button');
        resetBtn.textContent = 'Reset Identity';
        resetBtn.className = 'danger';
        resetBtn.onclick = function () { onResetIdentity(c); };
        actions.appendChild(renameBtn);
        actions.appendChild(revokeBtn);
        actions.appendChild(resetBtn);
        clientsBody.appendChild(tr);
      });
    }).catch(function (e) {
      clientsBody.innerHTML = '<tr><td colspan="6" class="empty status-bad">Error: ' + escapeHtml(e.message) + '</td></tr>';
    });
  }

  function onRename(c) {
    confirmModal({
      title: 'Rename client',
      body: 'New display name for ' + c.clientId + ':',
      input: true,
      inputDefault: c.displayName || '',
      inputPlaceholder: 'Display Name',
    }).then(function (name) {
      if (!name) return;
      return api('/api/admin/clients/' + encodeURIComponent(c.clientId) + '/rename', {
        method: 'POST',
        body: { displayName: name },
      }).then(function () { toast('Renamed.'); loadClients(); });
    }).catch(function (e) { toast(e.message, true); });
  }

  function onRevoke(c) {
    confirmModal({
      title: 'Revoke client',
      body: 'This will invalidate the client\'s current API key immediately. Provide a reason:',
      input: true,
      inputPlaceholder: 'compromised, user_request, …',
      danger: true,
      okLabel: 'Revoke',
    }).then(function (reason) {
      if (!reason) return;
      return api('/api/admin/clients/' + encodeURIComponent(c.clientId) + '/revoke', {
        method: 'POST',
        body: { reason: reason },
      }).then(function () { toast('Revoked.'); loadClients(); });
    }).catch(function (e) { toast(e.message, true); });
  }

  function onResetIdentity(c) {
    confirmModal({
      title: 'Reset identity',
      body: 'This deletes the client binding and revokes the active key. The client will need to re-pair from scratch. Proceed?',
      danger: true,
      okLabel: 'Reset',
    }).then(function (ok) {
      if (!ok) return;
      return api('/api/admin/clients/' + encodeURIComponent(c.clientId) + '/reset-identity', {
        method: 'POST',
      }).then(function () { toast('Identity reset.'); loadClients(); });
    }).catch(function (e) { toast(e.message, true); });
  }

  document.getElementById('refreshClients').addEventListener('click', loadClients);

  // ----------- audit tab -----------
  var auditBody = document.querySelector('#auditTable tbody');
  var auditOffset = 0;
  var auditLimit = 50;

  function loadAudit() {
    var params = new URLSearchParams();
    var evt = document.getElementById('auditEventType').value;
    var cid = document.getElementById('auditClientId').value.trim();
    var from = document.getElementById('auditFrom').value;
    var to = document.getElementById('auditTo').value;
    if (evt) params.set('eventType', evt);
    if (cid) params.set('clientId', cid);
    if (from) params.set('from', String(Date.parse(from)));
    if (to) params.set('to', String(Date.parse(to)));
    params.set('limit', String(auditLimit));
    params.set('offset', String(auditOffset));

    auditBody.innerHTML = '<tr><td colspan="6" class="empty">Loading…</td></tr>';
    api('/api/admin/audit?' + params.toString()).then(function (rows) {
      if (!rows || rows.length === 0) {
        auditBody.innerHTML = '<tr><td colspan="6" class="empty">No events.</td></tr>';
        return;
      }
      auditBody.innerHTML = '';
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        var outcomeClass = r.outcome === 'success' ? 'status-ok' : 'status-bad';
        tr.innerHTML =
          '<td class="mono">' + fmtDate(r.ts) + '</td>' +
          '<td class="mono">' + escapeHtml(r.event_type) + '</td>' +
          '<td class="mono">' + escapeHtml(r.client_id || '—') + '</td>' +
          '<td class="' + outcomeClass + '">' + escapeHtml(r.outcome) + '</td>' +
          '<td class="mono dim">' + escapeHtml(r.source_ip || '—') + '</td>' +
          '<td class="dim">' + escapeHtml(r.reason || '') + '</td>';
        auditBody.appendChild(tr);
      });
      document.getElementById('auditPageInfo').textContent =
        'offset ' + auditOffset + ' · showing ' + rows.length;
    }).catch(function (e) {
      auditBody.innerHTML = '<tr><td colspan="6" class="empty status-bad">Error: ' + escapeHtml(e.message) + '</td></tr>';
    });
  }

  document.getElementById('auditSearch').addEventListener('click', function () { auditOffset = 0; loadAudit(); });
  document.getElementById('auditReset').addEventListener('click', function () {
    document.getElementById('auditEventType').value = '';
    document.getElementById('auditClientId').value = '';
    document.getElementById('auditFrom').value = '';
    document.getElementById('auditTo').value = '';
    auditOffset = 0;
    loadAudit();
  });
  document.getElementById('auditPrev').addEventListener('click', function () {
    auditOffset = Math.max(0, auditOffset - auditLimit);
    loadAudit();
  });
  document.getElementById('auditNext').addEventListener('click', function () {
    auditOffset += auditLimit;
    loadAudit();
  });

  // ----------- settings tab -----------
  function loadSettings() {
    // No dedicated GET endpoint; admin UI shows what we know from env + headers.
    // The hub itself does not currently expose displayName/fingerprint via admin API
    // (pair.init advertises them). We surface placeholders here and rely on /admin
    // being reachable as proof of TLS working.
    document.getElementById('hubDisplayName').textContent = window.location.hostname;
    // Fingerprint: fetch via a HEAD request — not currently exposed; show placeholder.
    var fpEl = document.getElementById('tlsFingerprint');
    if (fpEl.textContent === 'unknown') {
      fpEl.textContent = 'see server logs / mDNS TXT record';
    }
  }

  document.getElementById('copyFp').addEventListener('click', function () {
    var t = document.getElementById('tlsFingerprint').textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast('Copied.'); });
    } else {
      toast('Clipboard unavailable.', true);
    }
  });

  document.getElementById('rotateKey').addEventListener('click', function () {
    confirmModal({
      title: 'Rotate admin key',
      body: 'The current admin key will be replaced. You will be prompted to enter the new key on the next request. Continue?',
      danger: true,
      okLabel: 'Rotate',
    }).then(function (ok) {
      if (!ok) return;
      return api('/api/admin/rotate-admin-key', { method: 'POST' }).then(function (res) {
        toast('Rotated. New key logged server-side.');
        clearAdminKey();
        setTimeout(function () { location.reload(); }, 1500);
      });
    }).catch(function (e) { toast(e.message, true); });
  });

  // ----------- util -----------
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ----------- init -----------
  document.getElementById('hubIdLabel').textContent = window.location.host;
  loadClients();
})();
</script>
</body>
</html>
